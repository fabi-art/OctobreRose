spring.application.name=grace

spring.datasource.url= jdbc:mysql://localhost:3306/octobrerose

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=myVerySecretKeyWhichShouldBeSufficientlyLong
jwt.expirationMs=86400000

server.port=8081
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=update

server.tomcat.max-http-header-size=655360
server.tomcat.max-swallow-size=209715200
server.tomcat.max-http-form-post-size=20971520
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.max-file-size=100MB
# Autoriser plus gros payloads JSON





spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true




